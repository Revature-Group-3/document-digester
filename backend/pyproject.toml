[project]
name = "document-digester"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Taylor-Klinsky", email = "taylor@klinsky.org" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.0",
    "langchain>=1.4.9",
    "langchain-chroma>=1.1.0",
    "langchain-experimental>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "sqlalchemy>=2.1.8",
    "sqlalchemy-utils>=0.43.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
document-digester = "document_digester:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
