[project]
name = "document-digester"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Taylor-Klinsky", email = "taylor@klinsky.org" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.0",
    "langchain>=1.4.9",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
document-digester = "document_digester:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
