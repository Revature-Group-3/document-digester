@let message = data();

<mat-card class="{{ message.role }}-bubble">
    <mat-card-content>
        @if (message.type === 'text') {
        <span>{{ message.createdAt | date:'shortTime' }}</span>
        <p class="message-content">{{ message.content }}</p>
        } @else if (message.type === 'search-results') {
        <span>{{ message.createdAt | date:'shortTime' }}</span>
        <app-search-results [results]="message.results" />
        }
    </mat-card-content>
</mat-card>
