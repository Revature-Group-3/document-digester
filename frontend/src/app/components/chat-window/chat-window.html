<main class="chat-window" [class.welcome-mode]="messages().length === 0" aria-label="Documentation conversation">
    @if (messages().length === 0) {
        <section class="welcome" aria-labelledby="welcome-title">
            <div class="welcome-content">
                <h1 id="welcome-title">Welcome! Ready when you are.</h1>
                <app-chat-input (messageSubmitted)="sendMessage($event)" />
            </div>
        </section>
    } @else {
        <app-search-bar [value]="messageSearch()" (searchChange)="messageSearch.set($event)" />
        <div class="chat-window-body">
            <app-message-list [messages]="filteredMessages()" />
            @if (searching()) {
                <p class="search-status" role="status">Searching documentation...</p>
            }
            @if (searchError()) {
                <p class="search-error" role="alert">{{ searchError() }}</p>
            }
            <app-chat-input (messageSubmitted)="sendMessage($event)" />
        </div>
    }
</main>
