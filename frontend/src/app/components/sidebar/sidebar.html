<mat-sidenav-container class="container">
    <mat-sidenav #sidenav mode="side" opened class="sidenav" [fixedInViewport]="true">
        <div class="sidenav-layout">
            <h2 class="sidebar-heading">Document Digester</h2>
            <app-search-bar [value]="conversationSearch()" (searchChange)="conversationSearch.set($event)" />
            <app-conversation-list [conversations]="filteredConversations()"
                [selectedConversationId]="selectedConversation()?.conversationId ?? null"
                (conversationSelected)="selectConversation($event)" />
        </div>
    </mat-sidenav>
    <mat-sidenav-content>
        <app-chat-window [conversation]="selectedConversation()" />
    </mat-sidenav-content>
</mat-sidenav-container>
